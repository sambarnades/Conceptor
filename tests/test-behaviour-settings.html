<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../">
    <title>Tests Reglages avances editeur</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f2f5; padding: 24px; color: #1a1a2e; }
        h1 { font-size: 1.5rem; margin-bottom: 8px; }
        .subtitle { font-size: 0.85rem; color: #666; margin-bottom: 20px; }
        .summary { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        .summary__card { padding: 14px 24px; border-radius: 10px; font-weight: 700; font-size: 1.3rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); min-width: 120px; text-align: center; }
        .summary__card small { display: block; font-size: 0.7rem; font-weight: 400; opacity: 0.8; margin-top: 2px; }
        .card--pass { background: linear-gradient(135deg, #d4edda, #c3e6cb); color: #155724; }
        .card--fail { background: linear-gradient(135deg, #f8d7da, #f5c6cb); color: #721c24; }
        .card--total { background: linear-gradient(135deg, #d1ecf1, #bee5eb); color: #0c5460; }
        .result { padding: 8px 16px; margin: 4px 0; border-radius: 6px; font-size: 0.85rem; font-family: monospace; }
        .result--pass { background: #d4edda; color: #155724; }
        .result--fail { background: #f8d7da; color: #721c24; }
        .module-header { font-weight: 700; font-size: 1rem; margin: 16px 0 8px; padding: 8px 12px; background: #fff; border-radius: 8px; border-left: 4px solid #1a1a2e; }
        .loading { text-align: center; padding: 60px; color: #666; }
        .loading__spinner { display: inline-block; width: 36px; height: 36px; border: 3px solid #ddd; border-top-color: #1a1a2e; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <h1>Tests reglages avances editeur</h1>
    <p class="subtitle">Verifie que les reglages behaviour traversent le pipeline : editeur &rarr; denormalize &rarr; processeur &rarr; H5P valide</p>
    <div id="summary" class="summary"></div>
    <div id="results">
        <div class="loading"><div class="loading__spinner"></div><p style="margin-top:12px;">Chargement des tests...</p></div>
    </div>
    <script type="module" src="tests/test-behaviour-settings.js"></script>
</body>
</html>
