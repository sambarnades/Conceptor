<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio voix off · Caramel 7</title>
<style>
/* Une régie : à gauche l'image et les blocs, à droite le prompteur, lisible de loin. */
:root {
  --fond: #eef1f5; --surface: #ffffff; --encre: #17212e; --doux: #5a6778; --filet: #d9e0e8;
  --accent: #0b5cad; --accent-fond: #e5eef9; --rouge: #c62828; --rouge-fond: #fdecec; --ok: #1f7a3f; --alerte: #a35b00;
  --p-fond: #0e131a; --p-texte: #f4f6f9; --p-doux: #7d8a9b; --p-actif: #ffd479;
  --taille-prompteur: 30px;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --fond: #12171e; --surface: #1a212b; --encre: #e7ecf2; --doux: #9aa7b6; --filet: #2c3643;
    --accent: #7db4ee; --accent-fond: #1c2e44; --rouge: #ff6b6b; --rouge-fond: #3a1d1f; --ok: #6fd08f; --alerte: #f0b35a; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--fond); color: var(--encre); display: grid; grid-template-rows: auto 1fr; font-size: 15px; }
button, select { font: inherit; }
button { cursor: pointer; border-radius: 8px; border: 1px solid var(--filet); background: var(--surface); color: var(--encre); padding: 8px 14px; }
button:hover:not(:disabled) { border-color: var(--accent); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: .45; cursor: default; }
#vers-table { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--accent); color: var(--accent); background: var(--accent-fond); text-decoration: none; font-weight: 600; }
.caramel { background: linear-gradient(180deg, #f0a24b, #d97b1c); color: #fff; border-color: #c96d12; font-weight: 700; }
.caramel:hover:not(:disabled) { filter: brightness(1.06); border-color: #c96d12; }
[hidden] { display: none !important; }
kbd { font: 12px ui-monospace, Menlo, monospace; border: 1px solid var(--filet); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }

.barre { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding: 10px 18px; background: var(--surface); border-bottom: 1px solid var(--filet); }
.barre h1 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 10px; }
.micro { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
.micro select { max-width: 260px; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--filet); background: var(--surface); color: var(--encre); }
.vu { width: 140px; height: 10px; border-radius: 5px; background: var(--filet); overflow: hidden; }
.vu > div { height: 100%; width: 0; background: linear-gradient(90deg, #2e9d57 0 70%, #e0a000 70% 90%, #d63b3b 90%); background-size: 140px 100%; }
#micro-etat { color: var(--doux); font-size: 13px; }
#compte { color: var(--doux); font-size: 13px; font-variant-numeric: tabular-nums; }

/* Deux réglages à la souris, gardés d'une séance à l'autre : la largeur de la colonne de
   gauche (--gauche, poignée entre les colonnes) et la taille de la vidéo (--video, poignée
   sous l'image), pour donner de la place à la liste des blocs. Double-clic : d'origine. */
.studio { display: grid; grid-template-columns: minmax(0, var(--gauche, 1.15fr)) 10px minmax(340px, 1fr); min-height: 0; }
.gauche { display: grid; grid-template-rows: auto auto auto auto 1fr; gap: 12px; padding: 16px 18px; min-height: 0; min-width: 0; }
.cadre { position: relative; width: var(--video, 100%); max-width: 100%; margin: 0 auto; }
.poignee { position: relative; touch-action: none; outline: none; }
.poignee::after { content: ""; position: absolute; background: var(--filet); border-radius: 2px; transition: background .15s; }
.poignee:hover::after, .poignee:focus-visible::after, .poignee.tire::after { background: var(--accent); }
.poignee--colonnes { cursor: col-resize; }
.poignee--colonnes::after { top: 0; bottom: 0; left: 4px; width: 2px; }
.poignee--video { height: 10px; margin: -8px 0; cursor: row-resize; }
.poignee--video::after { left: 35%; right: 35%; top: 3px; height: 4px; }
video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; display: block; }
#decompte { position: absolute; inset: 0; display: grid; place-items: center; font: 700 140px/1 -apple-system, sans-serif; color: #fff; text-shadow: 0 4px 30px rgba(0,0,0,.6); pointer-events: none; }
#rec { position: absolute; top: 12px; left: 12px; background: var(--rouge); color: #fff; font: 700 13px/1 -apple-system, sans-serif; padding: 6px 10px; border-radius: 6px; letter-spacing: .06em; }
#rec::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #fff; margin-right: 7px; animation: clignote 1s steps(2) infinite; }
@keyframes clignote { 50% { opacity: 0; } }

.frise { position: relative; display: flex; height: 26px; border-radius: 6px; overflow: hidden; background: var(--filet); cursor: pointer; }
.frise > span { height: 100%; border-right: 2px solid var(--fond); background: var(--surface); transition: background .2s; }
.frise > span.faite { background: color-mix(in srgb, var(--ok) 55%, var(--surface)); }
.frise > span.choisie { outline: 2px solid var(--accent); outline-offset: -2px; }
#tete-lecture { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--rouge); pointer-events: none; }

.commandes { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.rouge { background: var(--rouge); color: #fff; border-color: var(--rouge); font-weight: 600; }
.rouge:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--rouge); }
.contour-rouge { color: var(--rouge); border-color: var(--rouge); background: var(--rouge-fond); font-weight: 600; }
.aide { color: var(--doux); font-size: 13px; }
.aide kbd { margin: 0 2px; }

.liste { list-style: none; margin: 0; padding: 0 4px 12px 0; overflow-y: auto; display: grid; gap: 6px; align-content: start; min-height: 0; }
.liste .chap { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--doux); margin: 10px 0 0; }
.bloc { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto auto; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--filet); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.bloc.choisi { border-color: var(--accent); background: var(--accent-fond); }
.bloc .tc { font: 13px ui-monospace, Menlo, monospace; color: var(--doux); font-variant-numeric: tabular-nums; }
.bloc .nom { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bloc .nom small { font-weight: 400; color: var(--doux); margin-left: 6px; }
.bloc .etat { font-size: 13px; font-variant-numeric: tabular-nums; }
.bloc .etat.faite { color: var(--ok); }
.bloc .etat.alerte { color: var(--alerte); }
.bloc .etat.vide { color: var(--doux); }
.bloc button { padding: 4px 9px; font-size: 13px; }

.prompteur { position: relative; background: var(--p-fond); color: var(--p-texte); display: grid; grid-template-rows: auto auto 1fr auto; min-height: 0; }
.p-tete { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 22px; border-bottom: 1px solid #222b36; color: var(--p-doux); font-size: 14px; }
.p-tete b { color: var(--p-texte); font-weight: 600; }
.p-taille { display: flex; gap: 6px; }
.p-taille button, .p-edition button { background: #1b232e; color: var(--p-texte); border-color: #2c3746; padding: 3px 9px; }
.p-taille button[aria-pressed="true"] { border-color: var(--p-actif); color: var(--p-actif); }
/* Le temps qui reste au bloc, d'un coup d'œil : la barre se vide, rougit dans les 3 dernières secondes. */
.p-jauge { height: 4px; background: #1b232e; }
.p-jauge > div { height: 100%; width: 100%; background: var(--p-actif); transform-origin: left; transition: background .3s; }
.p-jauge.presse > div { background: #ff6b6b; }
#p-decompte { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font: 800 120px/1 -apple-system, sans-serif; color: var(--p-actif); pointer-events: none; text-shadow: 0 6px 30px rgba(0,0,0,.5); }
.p-edition { display: grid; grid-template-rows: 1fr auto auto; gap: 10px; padding: 18px 22px; min-height: 0; }
.p-edition textarea { width: 100%; min-height: 200px; resize: none; background: #141b24; color: var(--p-texte); border: 1px solid #2c3746; border-radius: 8px; padding: 14px 16px; font: 22px/1.5 -apple-system, sans-serif; }
.p-edition div { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--p-doux); font-size: 13px; }
.p-edition .enregistrer { background: var(--p-actif); color: #1a1300; border-color: var(--p-actif); font-weight: 700; }
.p-modifie { color: var(--p-actif); font-size: 12px; margin-left: 6px; }
/* La rallonge du bloc : sa dernière image reste figée, le micro continue. */
.p-rallonge { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.p-rallonge button { background: #1b232e; color: var(--p-texte); border-color: #2c3746; padding: 1px 9px; }
.p-rallonge button:disabled { opacity: .35; }
.p-rallonge output { min-width: 3.4em; text-align: center; color: var(--p-texte); font-variant-numeric: tabular-nums; }
.p-rallonge.active output { color: var(--p-actif); font-weight: 700; }
/* Le temps de lecture d'un texte réécrit, face à la place de la voix dans le bloc. */
.p-mesure { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--p-doux); font-size: 14px; }
.p-mesure b { color: var(--p-texte); font-variant-numeric: tabular-nums; }
.p-mesure.trop b.estime { color: #ff6b6b; }
.p-mesure.juste b.estime { color: #7ee2a8; }
#p-temps { font-variant-numeric: tabular-nums; }
#p-temps.presse { color: var(--p-actif); }
.p-texte { overflow-y: auto; padding: 26px 30px 40vh; font-size: var(--taille-prompteur); line-height: 1.5; }
.p-texte { scroll-behavior: smooth; }
.p-texte span { color: #a9b4c2; transition: color .25s, background-color .25s; border-radius: 6px; box-decoration-break: clone; -webkit-box-decoration-break: clone; padding: 1px 3px; }
.p-texte span.passee { color: #4b5563; }
.p-texte span.active { color: #fff; background: rgba(255, 212, 121, .14); box-shadow: inset 3px 0 0 var(--p-actif); }
.p-suivant { border-top: 1px solid #222b36; padding: 12px 22px; color: var(--p-doux); font-size: 15px; min-height: 48px; }
.p-suivant b { color: var(--p-texte); font-weight: 600; }

.message { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); max-width: min(720px, calc(100vw - 32px)); background: var(--surface); color: var(--encre); border: 1px solid var(--filet); border-radius: 10px; box-shadow: 0 8px 30px rgba(0,0,0,.18); padding: 10px 16px; font-size: 14px; line-height: 1.45; transition: opacity .4s, transform .4s; }
.message:empty { display: none; }
/* La bulle s'efface seule, en glissant vers le bas : elle ne cache plus la liste des blocs. */
.message.cache { opacity: 0; transform: translate(-50%, 24px); pointer-events: none; }
.message .fermer { margin-left: 12px; padding: 0 6px; border: 0; background: none; color: var(--doux); font-size: 18px; line-height: 1; vertical-align: middle; }
.message .ok { color: var(--ok); } .message .alerte { color: var(--alerte); }


/* Plein écran : le prompteur prend la place, la vidéo et les commandes passent dans une colonne étroite. */
body.plein .studio { grid-template-columns: minmax(280px, .5fr) 10px minmax(0, 1.5fr); }
body.plein .liste, body.plein .aide, body.plein .poignee--video { display: none; }
body.plein .gauche { grid-template-rows: auto auto auto; align-content: start; }
body.plein .cadre { width: 100%; }
body.plein .p-texte { font-size: calc(var(--taille-prompteur) * 1.3); padding: 30vh 8% 45vh; line-height: 1.55; }
@media (max-width: 980px) {
  body { grid-template-rows: auto auto; }
  .studio { grid-template-columns: minmax(0, 1fr); }
  .poignee--colonnes { display: none; }
  .prompteur { min-height: 60vh; }
}
@media (prefers-reduced-motion: reduce) { #rec::before { animation: none; } }
</style>
</head>
<body>
<header class="barre">
  <h1><img src="/logo.svg" alt="" width="26" height="26">Studio voix off · Caramel 7</h1>
  <span id="compte"></span>
  <div class="micro">
    <select id="micro-choix" aria-label="Microphone" hidden></select>
    <div class="vu" aria-hidden="true"><div id="vu"></div></div>
    <span id="micro-etat">Micro non activé</span>
    <button id="micro-activer" type="button">Activer le micro</button>
    <a id="vers-table" href="/table">Table de montage</a>
    <button id="apercu" type="button" title="Les voix posées sur l’image, sans habillage (une minute environ)">Aperçu rapide</button>
    <button id="generer" class="caramel" type="button" title="Montage des voix, caméra, cartons animés, musique sous la voix, copie sur le Bureau (6 minutes environ)">▶ Générer la vidéo</button>
  </div>
</header>

<main class="studio">
  <section class="gauche">
    <div class="cadre">
      <video id="video" src="/video.mp4" preload="auto" muted playsinline></video>
      <div id="decompte" hidden></div>
      <div id="rec" hidden>REC</div>
    </div>
    <div class="poignee poignee--video" id="poignee-video" role="separator" aria-orientation="horizontal" tabindex="0"
      aria-label="Taille de la vidéo" title="Glisser vers le haut : vidéo plus petite, liste des blocs plus grande (double-clic : taille d’origine)"></div>
    <div class="frise" id="frise" aria-label="Frise des blocs"><div id="tete-lecture"></div></div>
    <div class="commandes">
      <button id="enr-suite" class="rouge" type="button">● Enregistrer à partir d’ici</button>
      <button id="enr-bloc" class="contour-rouge" type="button">● Refaire ce bloc seul</button>
      <button id="ecouter" type="button">▶ Écouter à partir d’ici</button>
      <button id="arreter" type="button" hidden>■ Arrêter</button>
      <span class="aide"><kbd>Espace</kbd> enregistrer / arrêter · <kbd>B</kbd> ce bloc seul · <kbd>E</kbd> écouter · <kbd>←</kbd><kbd>→</kbd> bloc</span>
    </div>
    <ol class="liste" id="liste"></ol>
  </section>

  <div class="poignee poignee--colonnes" id="poignee-colonnes" role="separator" aria-orientation="vertical" tabindex="0"
    aria-label="Largeur de la colonne de gauche" title="Glisser pour élargir ou rétrécir la colonne de gauche (double-clic : largeur d’origine)"></div>

  <section class="prompteur" aria-label="Prompteur">
    <div class="p-tete">
      <span id="p-bloc"></span>
      <span id="p-temps"></span>
      <span class="p-rallonge" id="p-rallonge" title="Rallonge : la dernière image du bloc reste figée le temps de finir de parler (− / + par demi-seconde)">Rallonge <button id="r-moins" type="button" aria-label="Rallonge plus courte d’une demi-seconde">−</button><output id="r-valeur">0 s</output><button id="r-plus" type="button" aria-label="Rallonge plus longue d’une demi-seconde">+</button></span>
      <span class="p-taille"><button id="p-modifier" type="button" title="Réécrire le texte de ce bloc (la vidéo ne change pas)">✎ Texte</button><button id="p-moins" type="button" aria-label="Texte plus petit">A−</button><button id="p-plus" type="button" aria-label="Texte plus grand">A+</button><button id="p-plein" type="button" aria-pressed="false" title="Prompteur plein écran (F)">⛶</button></span>
    </div>
    <div class="p-jauge" id="p-jauge"><div></div></div>
    <div class="p-texte" id="p-texte"></div>
    <div class="p-edition" id="p-edition" hidden>
      <textarea id="p-saisie" aria-label="Texte du bloc" spellcheck="true"></textarea>
      <p class="p-mesure" id="p-mesure" aria-live="polite"></p>
      <div><button id="p-garder" class="enregistrer" type="button">Garder ce texte</button><button id="p-original" type="button">Revenir au texte d’origine</button><button id="p-annuler" type="button">Annuler</button>
        <span>Le prompteur répartit le nouveau texte sur la durée du bloc, rallonge comprise.</span></div>
    </div>
    <div id="p-decompte" hidden></div>
    <div class="p-suivant" id="p-suivant"></div>
  </section>
</main>

<div class="message" id="message" role="status" aria-live="polite"></div>

<script src="/travail.js"></script>

<script>
(async () => {
  const $ = s => document.querySelector(s);
  const video = $('#video');
  const PREROLL = 3;           // secondes de vidéo avant le bloc, pendant le décompte
  const APRES = 0.25;          // on dépasse un peu la fin du bloc avant de s'arrêter

  /* ---------------- Données ---------------- */
  const { duree: DUREE, marques } = await (await fetch('/marques.json', { cache: 'no-store' })).json();
  const blocs = marques.map((m, k) => ({ ...m, coupe: k + 1 < marques.length ? marques[k + 1].debut : DUREE, rallonge: 0 }));
  let prises = new Map();
  let choisi = Math.max(0, blocs.findIndex(b => b.id === new URLSearchParams(location.search).get('bloc')));
  /** Les réglages de la table de montage (part gardée, gain, décalage) et les textes réécrits. */
  let audio = {}, textes = {};

  /** Les rallonges de la table de montage : l'image se fige à la fin du bloc, le micro continue. */
  let RALLONGE_MAX = 30;
  async function chargerMontage() {
    const m = await (await fetch('/montage', { cache: 'no-store' })).json();
    for (const b of blocs) { b.rallonge = Number(m.rallonges?.[b.id]) || 0; b.place = b.coupe - b.debut; }
    audio = m.audio || {}; textes = m.textes || {};
    RALLONGE_MAX = Number(m.rallongeMax) || RALLONGE_MAX;
    pIndex = -1;
  }

  /** Une prise telle que la table l'a réglée (même règle que le montage, montage.mjs). */
  function reglage(id, duree) {
    const a = audio[id] || {};
    const debut = Math.min(Number(a.debut) || 0, Math.max(0, duree - 0.1));
    return { debut, fin: Math.max(debut + 0.05, Math.min(duree, a.fin ?? duree)), gain: Number(a.gain) || 0, decalage: Number(a.decalage) || 0 };
  }

  /**
   * Les phrases que lit le prompteur. Un texte réécrit est découpé en phrases, réparties
   * sur le temps de la voix d'origine, allongé au prorata du texte (sans dépasser la place).
   */
  function phrasesDe(b) {
    const t = textes[b.id];
    if (!t) return b.phrases;
    const morceaux = t.match(/[^.!?…]+(?:[.!?…]+["»”)]*|$)\s*/g)?.map(x => x.trim()).filter(Boolean) || [t];
    const d0 = b.phrases[0]?.offset ?? 0.3, der = b.phrases.at(-1);
    const origine = der ? der.offset + der.duree - d0 : b.place - 1;
    const nOrig = b.phrases.reduce((n, p) => n + p.texte.length, 0) || 1, n = morceaux.reduce((a, x) => a + x.length, 0);
    const etendue = Math.max(1, Math.min(b.place + b.rallonge - d0 - 0.3, origine * n / nOrig));
    let o = d0;
    return morceaux.map(texte => { const duree = etendue * texte.length / n; const p = { texte, offset: o, duree: Math.max(0.3, duree - 0.15) }; o += duree; return p; });
  }

  async function chargerPrises() {
    const r = await (await fetch('/prises', { cache: 'no-store' })).json();
    prises = new Map(r.prises.map(p => [p.id, { ...(prises.get(p.id) || {}), ...p }]));
    peindreListe();
  }

  /* ---------------- Liste et frise ---------------- */
  const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const liste = $('#liste'), frise = $('#frise');
  function peindreListe() {
    liste.replaceChildren();
    let chap;
    blocs.forEach((b, i) => {
      if (b.chapitre !== undefined && b.chapitre !== chap) {
        chap = b.chapitre;
        if (chap) { const h = document.createElement('li'); h.className = 'chap'; h.textContent = chap; liste.append(h); }
      }
      const p = prises.get(b.id);
      const li = document.createElement('li');
      li.className = 'bloc' + (i === choisi ? ' choisi' : '');
      li.dataset.i = i;
      const place = `${Math.round(b.place)} s${b.rallonge ? ` + ${b.rallonge} s` : ''}`;
      const etat = !p ? `<span class="etat vide">à enregistrer · ${place}</span>`
        : p.alerte ? `<span class="etat alerte" title="${p.alerte}">⚠ ${p.duree?.toFixed(1) ?? '?'} s</span>`
        : `<span class="etat faite">✓ ${p.duree?.toFixed(1) ?? '?'} s</span>`;
      li.innerHTML = `<span class="tc">${mmss(b.debut)}</span><span class="nom">${b.id}<small>${textes[b.id] ? '✎ ' : ''}${phrasesDe(b)[0]?.texte.slice(0, 48) ?? ''}…</small></span>${etat}`
        + (p ? `<button type="button" data-effacer="${i}" aria-label="Effacer la prise ${b.id}">Effacer</button>` : '<span></span>');
      liste.append(li);
    });
    frise.querySelectorAll('span').forEach(s => s.remove());
    blocs.forEach((b, i) => {
      const s = document.createElement('span');
      s.style.width = `${((b.coupe - b.debut) / DUREE) * 100}%`;
      s.className = (prises.has(b.id) ? 'faite' : '') + (i === choisi ? ' choisie' : '');
      s.title = b.id;
      frise.insertBefore(s, $('#tete-lecture'));
    });
    const n = blocs.filter(b => prises.has(b.id)).length;

  function choisir(i) {

  /* ---------------- Prompteur ---------------- */

    else { temps.textContent = `${enTenue ? 'rallonge · ' : ''}reste ${Math.max(0, Math.ceil(reste))} s`; temps.className = reste < 3 && enCours ? 'presse' : ''; }

    jauge.classList.toggle('presse', rel >= 0 && reste < 3 && enCours);

  let taille = 30;
  try { taille = Number(localStorage.getItem('caramel_studio_taille')) || 30; } catch { /* stockage indisponible */ }

  $('#p-moins').onclick = () => { taille = Math.max(18, taille - 3); appliquerTaille(); };

  /** Le plein écran du prompteur (F) : la vraie fenêtre plein écran, et la mise en page qui va avec. */
  function basculerPlein(forcer) {

  /* ---------------- Rallonges ----------------

  const aEcrire = new Map();

    // sauf pendant l'édition, que le changement de bloc refermerait.

    dire(v ? `Bloc « ${id} » : la dernière image reste figée ${secondes(v)} de plus. Réenregistre-le (<kbd>B</kbd>) pour profiter du temps gagné.`

      for (const [k, x] of aEcrire) { if (x) rallonges[k] = x; else delete rallonges[k]; }

  $('#r-moins').onclick = () => { const b = blocCourant(); if (b) reglerRallonge(b.id, b.rallonge - 0.5); };

  /** Sous le texte en cours d'écriture : le temps qu'il demande, la place qu'il a. */
  function peindreMesure() {

  async function sauverTextes(id, texte) {
    const origine = blocs.find(b => b.id === id).phrases.map(p => p.texte).join(' ');

  $('#p-garder').onclick = () => sauverTextes($('#p-saisie').dataset.id, $('#p-saisie').value);
  $('#p-original').onclick = () => sauverTextes($('#p-saisie').dataset.id, '');
  $('#p-annuler').onclick = () => fermerEdition();

  /* ---------------- Micro ---------------- */
  let ctx = null, flux = null, source = null, proc = null, analyseur = null;
  const assurerContexte = async () => { ctx ??= new AudioContext(); if (ctx.state !== 'running') await ctx.resume(); return ctx; };
  async function activerMicro(idAppareil) {
    await assurerContexte();
    try {
      flux?.getTracks().forEach(t => t.stop());
      // Ni annulation d'écho, ni réduction de bruit, ni gain automatique : ils abîment une
      // voix enregistrée au calme. Le niveau est harmonisé au montage.

    const choix = $('#micro-choix');
    choix.replaceChildren(...appareils.map(d => new Option(d.label || 'Micro', d.deviceId, false, d.deviceId === piste.getSettings().deviceId)));

  function surAudio(e) {
    if (!capture) return;

      capture.ctxDebut = ctx.currentTime - d.length / ctx.sampleRate - latence;

    capture.morceaux.push(new Float32Array(d));
    capture.total += d.length;

  /* ---------------- Enregistrement ---------------- */

  let tenue = null;

  async function allerA(t) { video.pause(); if (Math.abs(video.currentTime - t) < 0.01) return; video.currentTime = t; await attendre(video, 'seeked'); }

  async function enregistrer(mode) {
    if (capture || ecoute) return;

    await assurerContexte();
    const b = blocs[choisi];
    const preroll = Math.min(PREROLL, b.debut);
    await allerA(b.debut - preroll);
    // Chaque plage de lecture continue a son propre décalage vidéo − horloge audio : une
    // tenue (rallonge) arrête la vidéo, pas le micro.

    etatInterface();

  function mediane(v) { const s = [...v].sort((a, b) => a - b); return s[Math.floor(s.length / 2)]; }

  function wav(x, sr) {

  async function terminer() {
    const c = capture;
    if (!c) return;
    capture = null;
    video.pause();
    montrerDecompte(null);
    etatInterface();
    tenue = null;
    const plages = c.segments.filter(sg => sg.paires.length >= 3)
      .map(sg => ({ tMin: sg.paires[0][0], tMax: sg.paires.at(-1)[0], dec: mediane(sg.paires.map(p => p[1])) }));

    const x = new Float32Array(c.total);

    // L'instant (horloge audio) où la vidéo passait le début du bloc : dans la plage de lecture
    // qui le contient — la plus récente, celle qui reprend après une tenue.
    const debutAudio = b => {

      const tranche = x.subarray(i0, i0 + n);

      const alerte = diagnostiquer(tranche, c.sr, { suite: suiteGardee, enchaine: k > c.depart });

    await allerA(blocs[choisi].debut);
    peindreListe();
    const lignes = [];
    if (gardes.length) lignes.push(`<span class="ok">Gardé : ${gardes.join(', ')}.</span>`);
    if (interrompu !== null) lignes.push(`Bloc « ${blocs[interrompu].id} » interrompu, non gardé : <kbd>Espace</kbd> pour le reprendre.`);
    for (const a of alertes) lignes.push(`<span class="alerte">⚠ ${a}</span>`);
    dire(lignes.join('<br>') || 'Aucun bloc complet : rien gardé.');

  /* ---------------- Écoute ---------------- */
  let ecoute = null;
  const cache = new Map();
  async function tampon(id) {
    const p = prises.get(id);
    const cle = `${id}:${p?.le ?? p?.duree}`;
    if (!cache.has(cle)) {
      const r = await fetch(`/prises/${id}.wav?${Date.now()}`);
      if (!r.ok) return null;
      cache.set(cle, await ctx.decodeAudioData(await r.arrayBuffer()));
    }
    return cache.get(cle);
  }
  async function ecouter() {
    if (capture || ecoute) return;
    await assurerContexte();
    const d = blocs[choisi];
    const tampons = new Map();
    for (let k = choisi; k < blocs.length; k++) if (prises.has(blocs[k].id)) tampons.set(blocs[k].id, await tampon(blocs[k].id));
    if (!tampons.size) { dire('Aucune prise à écouter à partir de ce bloc.', 'alerte'); return; }
    await allerA(d.debut);
    // Chaque prise part quand la vidéo entre dans son bloc ; les tenues sont rejouées comme au montage.
    ecoute = { bloc: choisi, tampons, sources: [], lances: new Set() };
    etatInterface();
    await video.play();
  }
  /** Lance la prise du bloc k, `rel` secondes après le début du bloc (négatif : avant), réglée comme au montage. */
  function lancerPrise(k, rel) {
    const b = blocs[k], buf = ecoute.tampons.get(b.id);
    ecoute.lances.add(k);
    if (!buf) return;
    const r = reglage(b.id, buf.duration);
    const tau = Math.max(r.debut, rel - r.decalage), duree = r.fin - tau;
    if (duree <= 0.02) return;
    const s = ctx.createBufferSource(); s.buffer = buf;
    const g = ctx.createGain(); g.gain.value = Math.pow(10, r.gain / 20);
    s.connect(g).connect(ctx.destination);
    s.start(ctx.currentTime + Math.max(0, tau + r.decalage - rel), tau, duree);
    ecoute.sources.push(s);
  }
  /** Une prise avancée (décalage négatif) part avant le début de son bloc. */
  const avanceDe = k => { const b = blocs[k], buf = ecoute?.tampons.get(b.id); if (!buf) return 0; const r = reglage(b.id, buf.duration); return Math.max(0, -(r.debut + r.decalage)); };
  function arreterEcoute() {
    if (!ecoute) return;
    ecoute.sources.forEach(s => { try { s.stop(); } catch { /* déjà fini */ } });
    ecoute = null;
    tenue = null;
    video.pause();
    etatInterface();
  }
  /**
   * Au bout de la place d'un bloc : une tenue s'il a une rallonge (la vidéo se fige, le
   * micro ou la prise continuent), sinon on passe au bloc suivant. `etat` est la capture
   * ou l'écoute en cours ; son `bloc` est celui qui se joue.
   */
  function avancer(etat, t) {
    const dernierBloc = blocs.length - 1;
    const finir = () => (etat === capture ? terminer() : arreterEcoute());
    if (tenue) {
      if (ctx.currentTime < tenue.fin) return;
      const k = tenue.k;
      tenue = null;
      if (k === dernierBloc || (etat === capture && capture.mode === 'bloc')) return finir();
      etat.bloc = k + 1;
      if (etat === capture) capture.segments.push({ paires: [] });
      video.play();
      return;
    }
    const fini = video.ended;
    if (video.paused && !fini) return;
    const b = blocs[etat.bloc];
    if (t < b.coupe - 0.004 && !fini) return;
    if (b.rallonge > 0) { video.pause(); tenue = { k: etat.bloc, fin: ctx.currentTime + b.rallonge }; return; }
    if (etat === capture && capture.mode === 'bloc') { if (t >= b.coupe + APRES || fini) finir(); return; }
    if (etat.bloc < dernierBloc) etat.bloc++; else if (fini) finir();
  }

  /* ---------------- Interface ---------------- */
  function etatInterface() {
    const occupe = !!capture || !!ecoute;
    $('#rec').hidden = !capture;
    $('#arreter').hidden = !occupe;
    for (const id of ['#enr-suite', '#enr-bloc', '#ecouter', '#apercu', '#generer', '#p-modifier']) $(id).disabled = occupe;
  }
  /**
   * La bulle de message, en bas : elle s'efface seule, le temps de la lire (5 à 15 s selon
   * sa longueur, davantage pour une alerte), reste tant que la souris la survole, et se
   * ferme d'un clic sur ×. Elle ne masque plus la liste des blocs.
   */
  let minuterieMessage = null;
  const effacerPlusTard = ms => { clearTimeout(minuterieMessage); minuterieMessage = setTimeout(() => $('#message').classList.add('cache'), ms); };
  function dire(html, genre) {
    const m = $('#message');
    clearTimeout(minuterieMessage);
    m.classList.remove('cache');
    if (!html) { m.replaceChildren(); return; }
    m.innerHTML = (genre ? `<span class="${genre}">${html}</span>` : html)
      + '<button type="button" class="fermer" aria-label="Fermer le message" title="Fermer">×</button>';
    effacerPlusTard(Math.min(15000, 5000 + m.textContent.length * 45) * (genre === 'alerte' ? 1.5 : 1));
  }
  $('#message').addEventListener('mouseenter', () => clearTimeout(minuterieMessage));
  $('#message').addEventListener('mouseleave', () => { if ($('#message').textContent && !$('#message').classList.contains('cache')) effacerPlusTard(2500); });
  $('#message').addEventListener('click', e => { if (e.target.closest('.fermer')) { clearTimeout(minuterieMessage); $('#message').classList.add('cache'); } });

  /* ---------------- Mise en page réglable ---------------- */
  const studio = $('.studio'), gauche = $('.gauche');
  const lireReglage = cle => { try { return Number(localStorage.getItem(cle)) || 0; } catch { return 0; } };
  const garderReglage = (cle, v) => { try { if (v) localStorage.setItem(cle, String(v)); else localStorage.removeItem(cle); } catch { /* stockage indisponible */ } };
  let largeurGauche = lireReglage('caramel_studio_gauche'), tailleVideo = lireReglage('caramel_studio_video');
  const appliquerGauche = () => { if (largeurGauche) studio.style.setProperty('--gauche', `${largeurGauche}px`); else studio.style.removeProperty('--gauche'); };
  const appliquerVideo = () => { if (tailleVideo && tailleVideo < 100) gauche.style.setProperty('--video', `${tailleVideo}%`); else gauche.style.removeProperty('--video'); };
  appliquerGauche(); appliquerVideo();
  /** Une poignée qu'on tire : `bouger` suit le pointeur, `fini` garde le réglage. */
  function tirer(poignee, bouger, fini) {
    poignee.addEventListener('pointerdown', e => {
      e.preventDefault();
      poignee.setPointerCapture(e.pointerId);
      poignee.classList.add('tire');
      const lacher = () => {
        poignee.classList.remove('tire');
        poignee.removeEventListener('pointermove', bouger);
        poignee.removeEventListener('pointerup', lacher);
        poignee.removeEventListener('pointercancel', lacher);
        fini();
      };
      poignee.addEventListener('pointermove', bouger);
      poignee.addEventListener('pointerup', lacher);
      poignee.addEventListener('pointercancel', lacher);
    });
  }
  // La colonne de gauche : de 360 px à ce qui laisse 340 px au prompteur.
  const bornerGauche = px => Math.round(Math.max(360, Math.min(studio.getBoundingClientRect().width - 350, px)));
  const pColonnes = $('#poignee-colonnes');
  tirer(pColonnes, e => { largeurGauche = bornerGauche(e.clientX - studio.getBoundingClientRect().left); appliquerGauche(); },
    () => garderReglage('caramel_studio_gauche', largeurGauche));
  pColonnes.addEventListener('dblclick', () => { largeurGauche = 0; appliquerGauche(); garderReglage('caramel_studio_gauche', 0); });
  pColonnes.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault(); e.stopPropagation();
    largeurGauche = bornerGauche(gauche.getBoundingClientRect().width + (e.key === 'ArrowRight' ? 24 : -24));
    appliquerGauche(); garderReglage('caramel_studio_gauche', largeurGauche);
  });
  // La vidéo : sa largeur suit la hauteur voulue (16/9), de 30 % à toute la colonne.
  const pVideo = $('#poignee-video');
  const largeurUtile = () => gauche.clientWidth - 36;
  tirer(pVideo, e => {
    const hauteur = e.clientY - $('.cadre').getBoundingClientRect().top;
    tailleVideo = Math.round(Math.max(30, Math.min(100, (hauteur * 16 / 9) / largeurUtile() * 100)));
    appliquerVideo();
  }, () => garderReglage('caramel_studio_video', tailleVideo < 100 ? tailleVideo : 0));
  pVideo.addEventListener('dblclick', () => { tailleVideo = 0; appliquerVideo(); garderReglage('caramel_studio_video', 0); });
  pVideo.addEventListener('keydown', e => {
    if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown') return;
    e.preventDefault(); e.stopPropagation();
    tailleVideo = Math.max(30, Math.min(100, (tailleVideo || 100) + (e.key === 'ArrowDown' ? 5 : -5)));
    appliquerVideo(); garderReglage('caramel_studio_video', tailleVideo < 100 ? tailleVideo : 0);
  });
  // Un bouton cliqué à la souris garderait le focus, et la barre d'espace le recliquerait.
  document.addEventListener('click', e => { if (e.detail > 0) e.target.closest('button')?.blur(); });
  $('#enr-suite').onclick = () => enregistrer('suite');
  $('#enr-bloc').onclick = () => enregistrer('bloc');
  $('#ecouter').onclick = () => ecouter();
  $('#arreter').onclick = () => capture ? terminer() : arreterEcoute();
  document.addEventListener('keydown', e => {
    if (e.target.closest('select, dialog, textarea')) return;
    if (e.code === 'Space') { e.preventDefault(); if (capture) terminer(); else if (ecoute) arreterEcoute(); else enregistrer('suite'); }
    else if (e.code === 'Escape') { if (capture) terminer(); else arreterEcoute(); }
    else if (e.key === 'b' || e.key === 'B') enregistrer('bloc');
    else if (e.key === 'e' || e.key === 'E') ecouter();
    else if (e.key === 'f' || e.key === 'F') basculerPlein();
    else if (e.key === 'ArrowLeft') { e.preventDefault(); choisir(choisi - 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); choisir(choisi + 1); }
  });

  $('#apercu').onclick = () => Travail.lancer('apercu');
  $('#generer').onclick = () => Travail.lancer('finale');

  /* ---------------- Boucle ---------------- */
  const vu = $('#vu'), tete = $('#tete-lecture');
  const niveau = new Float32Array(2048);
  function boucle() {
    const t = video.currentTime;
    peindrePrompteur(t);
    tete.style.left = `${(t / DUREE) * 100}%`;
    if (analyseur) {
      analyseur.getFloatTimeDomainData(niveau);
      const r = rms(niveau, 0, niveau.length);
      vu.style.width = `${Math.min(100, Math.max(0, (20 * Math.log10(r + 1e-6) + 60) / 60 * 100))}%`;
    }
    if (capture) {
      if (!video.paused && !video.seeking && video.readyState >= 3 && !tenue) capture.segments.at(-1).paires.push([t, t - ctx.currentTime]);
      const b = blocs[capture.depart];
      if (t < b.debut && !video.paused) montrerDecompte(Math.ceil(b.debut - t)); else if (!video.paused) montrerDecompte(null);
      avancer(capture, t);
    } else if (ecoute) {
      const k = ecoute.bloc, suivant = k + 1 < blocs.length ? k + 1 : null;
      if (!video.paused && !tenue) {
        if (!ecoute.lances.has(k) && t >= blocs[k].debut - avanceDe(k) - 0.02) lancerPrise(k, t - blocs[k].debut);
        if (suivant !== null && !blocs[k].rallonge && !ecoute.lances.has(suivant) && t >= blocs[suivant].debut - avanceDe(suivant) - 0.02) lancerPrise(suivant, t - blocs[suivant].debut);
      } else if (tenue && suivant !== null && !ecoute.lances.has(suivant)) {
        const reste = tenue.fin - ctx.currentTime;
        if (reste <= avanceDe(suivant) + 0.02) lancerPrise(suivant, -reste);
      }
      avancer(ecoute, t);
    }
    requestAnimationFrame(boucle);
  }

  await chargerMontage();
  await chargerPrises();
  await allerA(blocs[choisi].debut).catch(() => {});
  // Revenu de la table de montage (autre onglet) : on relit rallonges et prises.
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || capture || ecoute) return;
    await chargerMontage();
    await chargerPrises();
  });
  etatInterface();
  requestAnimationFrame(boucle);
  dire('Active le micro, choisis un bloc, puis <kbd>Espace</kbd> : trois secondes de décompte, et la vidéo part. Lis ce qui s’allume. <kbd>F</kbd> : prompteur plein écran.');
})();
</script>
</body>
</html>
