<?xml version="1.0" encoding="UTF-8"?>
<!--
  Gwenn ha du - drapeau de la Bretagne, entree « Brezhoneg » du selecteur de langue.

  PROVENANCE
    Source  : Wikimedia Commons - File:Flag_of_Brittany_(Gwenn_ha_du).svg
              https://commons.wikimedia.org/wiki/File:Flag_of_Brittany_(Gwenn_ha_du).svg
    Auteur  : Gryffindor (via l'Open Clip Art Library)
    Licence : CC0 1.0 Universal / domaine public (PD-France).
              Aucune obligation d'attribution ; Caramel credite tout de meme l'auteur
              - droit moral au nom, et coherence avec les mentions legales, ou ce
              fichier est declare sous la cle `legal_library_gwenn_ha_du`
              (cf. tests/vendor-legal-map.js, liste ASSETS_A_MENTION).

  POURQUOI CE FICHIER VIT ICI ET NON DANS css/vendor/
    flag-icons ne fournit de drapeau que pour les codes pays ISO 3166 (et quelques
    subdivisions GB/ES) ; le breton n'a pas de code pays, donc pas de classe `fi-br`.
    Patcher le vendor serait ecrase a la prochaine mise a jour (cf. CLAUDE.md) : le
    drapeau est donc un ASSET Caramel, branche par la regle `.fi-bzh` de
    css/base/style.css.

  UNIQUE MODIFICATION APPORTEE AU FICHIER AMONT - la ligne <svg> ci-dessous :
      amont   width="1350" height="900"                        (3:2, ratio officiel)
      ici     width="1200" height="900" viewBox="0 0 1200 900" (4:3, gabarit du menu)
    Tout le reste - bandes, canton, mouchetures - est le balisage amont AU CARACTERE
    PRES, verifiable par un `diff` avec le fichier de Commons. Ne pas le retoucher :
    une correction de trace doit venir de l'amont, pas d'ici.

  POURQUOI ROGNER PLUTOT QUE GARDER LE 3:2
    La classe `.fi` de flag-icons applique `background-size: contain` dans une boite
    de rapport 4:3. Un fichier 3:2 y est donc « letterboxe » : le drapeau s'affiche
    visiblement plus court que ses onze voisins, avec du blanc au-dessus et au-dessous
    (constate a l'ecran avant de trancher). Ramener la viewBox a 1200 x 900 rogne
    150 unites de la VOLEE, c'est-a-dire uniquement des bandes : ni le canton
    (x 0..600) ni aucune moucheture n'est touche. Le canton occupe alors 50 % de la
    largeur au lieu de 44,4 % - exactement le type d'adaptation que flag-icons
    applique a ses propres drapeaux (voir gr.svg, l'autre drapeau a neuf bandes et
    canton, dont le canton passe de 37 % a 41,7 %).
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="900" viewBox="0 0 1200 900">
	<rect width="1350" height="900" fill="#fff"/>
	<rect x="600" width="1350" height="100" fill="#000"/>
	<rect x="600" y="200" width="1350" height="100" fill="#000"/>
	<rect y="400" width="1350" height="100" fill="#000"/>
	<rect y="600" width="1350" height="100" fill="#000"/>
	<rect y="800" width="1350" height="100" fill="#000"/>
	<use xlink:href="#ermine" x="-225" y="-122.5"/>
	<use xlink:href="#ermine" x="-75" y="-122.5"/>
	<use xlink:href="#ermine" x="75" y="-122.5"/>
	<use xlink:href="#ermine" x="225" y="-122.5"/>
	<use xlink:href="#ermine" x="-150"/>
	<g id="ermine" fill="#000">
		<use xlink:href="#s" transform="rotate(-90 300,167.5)"/>
		<path id="s" d="M 300,167.5 l -9,-13.5 l 9,-22.5 l 9,22.5 z"/>
		<use xlink:href="#s" transform="rotate(90 300,167.5)"/>
		<path d="M 300,167.5 l 40.5,99 l -31.5,-13.5 l -9,18 l -9,-18 l -31.5,13.5 z"/>
	</g>
	<use xlink:href="#ermine" x="150"/>
	<use xlink:href="#ermine" x="-225" y="122.5"/>
	<use xlink:href="#ermine" x="-75" y="122.5"/>
	<use xlink:href="#ermine" x="75" y="122.5"/>
	<use xlink:href="#ermine" x="225" y="122.5"/>
</svg>
