# =============================================================================
# Caramel — Pipeline GitLab Pages
#
# Minifie le JS (ES6 modules), le CSS, les JSON, et le HTML avant déploiement.
# Les fichiers vendor (h5p-libs, h5p-standalone, etc.) sont déjà optimisés
# et ne sont PAS modifiés.
#
# Outils : terser (JS ES6), clean-css-cli (CSS), html-minifier-terser (HTML)
# =============================================================================

pages:
  stage: deploy
  environment: production
  image: node:20-alpine
  script:
    # ------------------------------------------------------------------
    # 1. Installation des outils de minification
    # ------------------------------------------------------------------
    - npm install --no-save terser clean-css-cli html-minifier-terser

    # ------------------------------------------------------------------
    # 2. Copie du projet dans .public (on travaille sur la copie)
    #    On exclut les dossiers inutiles en production.
    #
    #    embed-editor.html (façade iframe pour Sucrerie S1/S2) a été
    #    supprimé le 2026-05-07 — Sucrerie est passé à l'éditeur natif
    #    inline (S3) et plus aucune app n'iframe Caramel.
    # ------------------------------------------------------------------
    - mkdir -p .public
    - |
      cp -r assets css js index.html .public/
      cp _headers .public/ 2>/dev/null || true   # headers de sécurité Pages (audit S07)
      rm -rf .public/tests .public/docs .public/scripts

    # ------------------------------------------------------------------
    # 3. Injection des URLs n8n
    #
    #    Les URLs sont centralisées dans js/core/endpoints.js (registre unique,
    #    même esprit que LIB_PATHS) avec les valeurs dev pour le local. Le CI/CD
    #    les écrase ici DANS CE SEUL FICHIER avec les variables définies une fois
    #    dans GitLab → Settings → CI/CD → Variables :
    #      LLM_SUBMIT_URL          (ex: https://…/caramel/llm/submit-prod)
    #      LLM_RESULT_URL          (ex: https://…/caramel/llm/result-prod)
    #      LLM_STATS_URL           (ex: https://…/caramel/llm/stats-prod) — ligne Grist agrégée (génération par lots)
    #      CARAMELIA_WEBHOOK_URL   (ex: https://…/caramelia-prod)
    #      CARAMELIA_AUDIO_URL     (ex: https://…/caramel-audio-prod)
    #      PDF_CONVERT_URL         (ex: https://…/caramel-pdf-convert-prod)
    #      CARAMEL_VIDEO_TRANSCRIPT_URL (ex: https://…/caramel-video-transcript-prod)
    #      CARAMEL_FETCH_PAGE_URL       (ex: https://…/caramel-fetch-page-prod)
    #
    #    Les 8 sont OBLIGATOIRES : le build echoue (exit 1) si l'une manque.
    # ------------------------------------------------------------------
    - |
      echo "=== Injection URLs n8n ==="
      if [ -z "$LLM_SUBMIT_URL" ] || [ -z "$LLM_RESULT_URL" ] || [ -z "$LLM_STATS_URL" ] || [ -z "$CARAMELIA_WEBHOOK_URL" ] || [ -z "$CARAMELIA_AUDIO_URL" ] || [ -z "$PDF_CONVERT_URL" ] || [ -z "$CARAMEL_VIDEO_TRANSCRIPT_URL" ] || [ -z "$CARAMEL_FETCH_PAGE_URL" ]; then
        echo "  ERREUR: une des 8 URLs n8n (LLM_SUBMIT_URL, LLM_RESULT_URL, LLM_STATS_URL, CARAMELIA_WEBHOOK_URL, CARAMELIA_AUDIO_URL, PDF_CONVERT_URL, CARAMEL_VIDEO_TRANSCRIPT_URL, CARAMEL_FETCH_PAGE_URL) n'est pas definie dans les variables CI/CD !"
        echo "  → GitLab > Settings > CI/CD > Variables"
        exit 1
      fi
      ENDPOINTS_FILE=.public/js/core/endpoints.js
      sed -i "s|const LLM_SUBMIT_URL = \".*\"|const LLM_SUBMIT_URL = \"${LLM_SUBMIT_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const LLM_RESULT_URL = \".*\"|const LLM_RESULT_URL = \"${LLM_RESULT_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const LLM_STATS_URL = \".*\"|const LLM_STATS_URL = \"${LLM_STATS_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const CARAMELIA_WEBHOOK_URL = \".*\"|const CARAMELIA_WEBHOOK_URL = \"${CARAMELIA_WEBHOOK_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const CARAMELIA_AUDIO_URL = \".*\"|const CARAMELIA_AUDIO_URL = \"${CARAMELIA_AUDIO_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const PDF_CONVERT_URL = \".*\"|const PDF_CONVERT_URL = \"${PDF_CONVERT_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const CARAMEL_VIDEO_TRANSCRIPT_URL = \".*\"|const CARAMEL_VIDEO_TRANSCRIPT_URL = \"${CARAMEL_VIDEO_TRANSCRIPT_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const CARAMEL_FETCH_PAGE_URL = \".*\"|const CARAMEL_FETCH_PAGE_URL = \"${CARAMEL_FETCH_PAGE_URL}\"|g" "$ENDPOINTS_FILE"
      echo "  LLM_SUBMIT_URL        : ${LLM_SUBMIT_URL}"
      echo "  LLM_RESULT_URL        : ${LLM_RESULT_URL}"
      echo "  LLM_STATS_URL         : ${LLM_STATS_URL}"
      echo "  CARAMELIA_WEBHOOK_URL : ${CARAMELIA_WEBHOOK_URL}"
      echo "  CARAMELIA_AUDIO_URL   : ${CARAMELIA_AUDIO_URL}"
      echo "  PDF_CONVERT_URL       : ${PDF_CONVERT_URL}"
      echo "  CARAMEL_VIDEO_TRANSCRIPT_URL : ${CARAMEL_VIDEO_TRANSCRIPT_URL}"
      echo "  CARAMEL_FETCH_PAGE_URL       : ${CARAMEL_FETCH_PAGE_URL}"

    # ------------------------------------------------------------------
    # 4. Minification JS — modules ES6 (~79 fichiers applicatifs)
    #
    #    - --module : préserve import/export, top-level await
    #    - --compress : dead code elimination, constant folding
    #    - --mangle : renomme les variables locales (pas les exports)
    #    - On exclut js/vendor/ (libs déjà optimisées + h5p-libs intouchables)
    #    - On exclut les .min.js (déjà minifiés)
    # ------------------------------------------------------------------
    - |
      echo "=== Minification JS ==="
      JS_COUNT=0
      JS_FAIL=0
      for f in $(find .public/js -name '*.js' -not -path '.public/js/vendor/*' -not -name '*.min.js'); do
        if npx terser "$f" \
          --module \
          --compress 'passes=2,dead_code=true,drop_console=false' \
          --mangle \
          --output "$f" 2>/dev/null; then
          JS_COUNT=$((JS_COUNT + 1))
        else
          echo "  WARN: echec minification $f (fichier original conserve)"
          JS_FAIL=$((JS_FAIL + 1))
        fi
      done
      echo "  JS: $JS_COUNT fichiers minifies, $JS_FAIL echecs"

    # ------------------------------------------------------------------
    # 5. Minification CSS (7 fichiers base + composants)
    #
    #    - On exclut css/vendor/ (FontAwesome, flag-icons déjà .min.css)
    # ------------------------------------------------------------------
    - |
      echo "=== Minification CSS ==="
      CSS_COUNT=0
      CSS_FAIL=0
      for f in $(find .public/css -name '*.css' -not -path '.public/css/vendor/*' -not -name '*.min.css'); do
        if npx clean-css-cli -O1 -o "$f.min" "$f" && [ -s "$f.min" ]; then
          mv "$f.min" "$f"
          CSS_COUNT=$((CSS_COUNT + 1))
        else
          rm -f "$f.min"
          echo "  WARN: echec minification $f (fichier original conserve)"
          CSS_FAIL=$((CSS_FAIL + 1))
        fi
      done
      echo "  CSS: $CSS_COUNT fichiers minifies, $CSS_FAIL echecs"

    # ------------------------------------------------------------------
    # 6. Compactage JSON — locales et exemples
    #
    #    Suppression des espaces et indentation (11 locales + exemples)
    # ------------------------------------------------------------------
    - |
      echo "=== Compactage JSON ==="
      JSON_COUNT=0
      for dir in .public/js/locales .public/assets/data/examples; do
        if [ -d "$dir" ]; then
          for f in $(find "$dir" -name '*.json'); do
            node -e "var f=require('fs'),p='$f';f.writeFileSync(p,JSON.stringify(JSON.parse(f.readFileSync(p,'utf8'))))" 2>/dev/null && JSON_COUNT=$((JSON_COUNT + 1))
          done
        fi
      done
      echo "  JSON: $JSON_COUNT fichiers compactes"

    # ------------------------------------------------------------------
    # 7. Minification HTML — index.html
    #
    #    Préserve les scripts inline (Matomo) et les attributs data-*
    # ------------------------------------------------------------------
    - |
      echo "=== Minification HTML ==="
      HTML_OK=0
      HTML_FAIL=0
      for f in .public/index.html; do
        [ -f "$f" ] || continue
        if npx html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --remove-empty-attributes \
            --minify-css true \
            --conservative-collapse \
            --keep-closing-slash \
            -o "$f" \
            "$f" 2>/dev/null; then
          HTML_OK=$((HTML_OK + 1))
        else
          HTML_FAIL=$((HTML_FAIL + 1))
          echo "  WARN: echec minification $f (original conserve)"
        fi
      done
      echo "  HTML: $HTML_OK fichiers minifies, $HTML_FAIL echecs"

    # ------------------------------------------------------------------
    # 8. Pré-compression Brotli + gzip (transport)
    #
    #    Génère une variante .br et .gz à côté de chaque fichier texte (après
    #    minification, pour compresser la sortie finale). GitLab Pages sert
    #    automatiquement la variante pré-compressée selon Accept-Encoding.
    #    zlib natif de Node → aucune install supplémentaire.
    # ------------------------------------------------------------------
    - |
      echo "=== Pré-compression Brotli + gzip ==="
      node scripts/precompress.mjs .public

    # ------------------------------------------------------------------
    # 9. Rapport de tailles
    # ------------------------------------------------------------------
    - |
      echo "=== Rapport final ==="
      echo "  JS (hors vendor) :"
      find .public/js -name '*.js' -not -path '.public/js/vendor/*' -exec cat {} + | wc -c | awk '{printf "    %d Ko\n", $1/1024}'
      echo "  CSS (hors vendor) :"
      find .public/css -name '*.css' -not -path '.public/css/vendor/*' -exec cat {} + | wc -c | awk '{printf "    %d Ko\n", $1/1024}'
      echo "  Locales JSON :"
      find .public/js/locales -name '*.json' -exec cat {} + | wc -c | awk '{printf "    %d Ko\n", $1/1024}'
      echo "  Total deploye :"
      du -sh .public/

    # ------------------------------------------------------------------
    # 10. Déplacement final pour GitLab Pages
    # ------------------------------------------------------------------
    - rm -rf public
    - mv .public public

  artifacts:
    paths:
      - public
