# =============================================================================
# Caramel — Pipeline GitLab Pages
#
# Minifie le JS (ES6 modules), le CSS, les JSON, et le HTML avant déploiement.
# Les fichiers vendor (h5p-libs, h5p-standalone, etc.) sont déjà optimisés
# et ne sont PAS modifiés.
#
# Outils : terser (JS ES6), clean-css-cli (CSS), html-minifier-terser (HTML)
# =============================================================================

# -----------------------------------------------------------------------------
# JOB 1 — Validation (avant tout déploiement)
#
# Ajouté suite à l'audit de synchronisation avec Sucrerie (2026-07-29) : ce
# pipeline n'avait aucune étape de contrôle, si bien qu'une clé i18n absente
# partait en production sans rien déclencher. `t()` (et son wrapper
# `translateLabel()`) renvoient la CLÉ quand elle manque — elle s'affiche donc
# brute à l'utilisateur, et l'idiome `t(x) || 'repli'` ne protège pas puisque la
# clé est « truthy ». 8 clés étaient dans ce cas, dont du texte visible.
# -----------------------------------------------------------------------------
validate:
  stage: test
  image: node:20-alpine
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: $CI_MERGE_REQUEST_ID
  script:
    - echo "→ Validation JSON des 12 locales"
    - |
      set -eu
      for f in js/locales/*.json; do
        node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "  KO : $f"; exit 1; }
        echo "  OK : $f"
      done
    - echo "→ Complétude des locales"
    - node scripts/verify-all-locales.mjs
    - echo "→ Parité i18n de l'éditeur et de l'export (partagés avec Sucrerie)"
    - node scripts/check-shared-i18n.mjs
    # Un .h5p n'embarque PAS les librairies : sur Éléa, seule la partie de
    # content.json écrite par le processeur est traduite. Un champ traduisible
    # oublié repart donc en ANGLAIS, et un champ écrit en dur fige une langue —
    # deux régressions invisibles en relecture de diff. (Audit langues 2026-08.)
    - echo "→ Couverture des libellés d'interface H5P (12 locales)"
    - node tests/run_h5p_ui_coverage.mjs
    - echo "→ Garde-fous et documentation du parcours"
    - node tests/run_parcours_gardefous.mjs
    - node tests/run_parcours_types.mjs
    - node tests/run_parcours_documentation.mjs
    # Ces bancs Node (sans navigateur) ne tournaient qu'à la main. Un champ texte
    # rendu en liste par le modèle faisait planter la mise en forme de 24 modules,
    # et les références de trois oracles avaient dérivé depuis des semaines sans
    # que rien ne le signale (audit des tests, 15 sept. 2026). Tous vérifiés sous
    # Node 20. Les bancs Playwright restent à lancer à la main (voir tests/).
    - echo "→ Réparateur, processeurs et validateurs (bancs Node)"
    - node tests/run_deformations_modele.mjs
    - node tests/run_heal_rules_tests.mjs
    - node tests/run_validators_rules_tests.mjs
    - node tests/run_validators_oracle.mjs
    - node tests/roundtrip/harness.mjs
    - node tests/run_clean_json_input_tests.mjs
    - node tests/run_sources_prompt_tests.mjs
    - node tests/run_math_tests.mjs
    - node tests/run_semantics_audit.mjs
    # Ces bancs valident les XML avec xmllint et manipulent des archives avec zip
    # et unzip, absents de node:20-alpine (la MR 6 a échoué sur « spawnSync xmllint
    # ENOENT » alors que les bancs passaient sur une machine qui les avait).
    - echo "→ Outils système des bancs Moodle et export (xmllint, zip, unzip)"
    - apk add --no-cache libxml2-utils zip unzip
    - echo "→ Moodle, exports et fichiers (bancs Node)"
    - node tests/run_moodle_backup_tests.mjs
    - node tests/run_moodle_import_tests.mjs
    - node tests/roundtrip/mbz-quiz-backup.mjs
    - node tests/roundtrip/docx-image-type.mjs
    - node tests/roundtrip/latex-display-wrap.mjs
    - node tests/roundtrip/placeholder-collision.mjs
    - node tests/roundtrip/comparer-export-elea.test.mjs
    - node tests/run_ocr_filetype_tests.mjs
    - echo "→ Sécurité, stockage et hygiène (bancs Node)"
    - node tests/run_escape_tests.mjs
    - node tests/run_safe_storage_tests.mjs
    - node tests/run_profanity_tests.mjs
    - node tests/run_sucrerie_allowed_domains.mjs
    - node tests/run_rag_orchestrator_tests.mjs
    - node tests/run_grid_canvas_utils_tests.mjs
    - node tests/run_legal_notices.mjs
    - node tests/run_module_hygiene.mjs
    # Langue du contenu (D87) et jetons de Série de choix uniques.
    - node tests/run_langue_contenu.mjs
    # Page de présentation /decouvrir/ : données, liens, publication (le volet navigateur
    # demande Playwright, absent du runner : à lancer en local sans l'option).
    - node tests/run_decouvrir.mjs --sans-navigateur
    # Studio de la vidéo de présentation : réglages du montage (fonctions pures).
    - node tests/run_video_demo_montage.mjs

# -----------------------------------------------------------------------------
# JOB 2 — Minification + déploiement GitLab Pages
# -----------------------------------------------------------------------------
pages:
  stage: deploy
  environment: production
  image: node:20-alpine
  # Ne se déclenche QUE sur la branche par défaut (main). Les tags de version
  # ne doivent pas lancer ce job : GitLab Pages ne publie que depuis main, et
  # les variables CI/CD n8n sont "Protected" → absentes sur un tag non protégé
  # → le garde-fou d'injection des URLs (étape 3) échouait avec exit 1.
  # (Cf. « toutes les étiquettes en erreur » — audit 2026-07.)
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  script:
    # ------------------------------------------------------------------
    # 1. Installation des outils de minification
    # ------------------------------------------------------------------
    - npm install --no-save terser clean-css-cli html-minifier-terser

    # ------------------------------------------------------------------
    # 2. Copie du projet dans .public (on travaille sur la copie)
    #    On exclut les dossiers inutiles en production.
    #
    #    embed-editor.html (façade iframe pour Sucrerie S1/S2) a été
    #    supprimé le 2026-05-07 — Sucrerie est passé à l'éditeur natif
    #    inline (S3) et plus aucune app n'iframe Caramel.
    # ------------------------------------------------------------------
    - mkdir -p .public
    - |
      cp -r assets css js decouvrir index.html .public/
      cp _headers .public/ 2>/dev/null || true   # headers de sécurité Pages (audit S07)
      rm -rf .public/tests .public/docs .public/scripts

    # ------------------------------------------------------------------
    # 3. Injection des URLs n8n
    #
    #    Les URLs sont centralisées dans js/core/endpoints.js (registre unique,
    #    même esprit que LIB_PATHS) avec les valeurs dev pour le local. Le CI/CD
    #    les écrase ici DANS CE SEUL FICHIER avec les variables définies une fois
    #    dans GitLab → Settings → CI/CD → Variables :
    #      LLM_SUBMIT_URL          (ex: https://…/caramel/llm/submit-prod)
    #      LLM_RESULT_URL          (ex: https://…/caramel/llm/result-prod)
    #      LLM_STATS_URL           (ex: https://…/caramel/llm/stats-prod) — ligne Grist agrégée (génération par lots)
    #      CARAMELIA_WEBHOOK_URL   (ex: https://…/caramelia-prod)
    #      CARAMELIA_AUDIO_URL     (ex: https://…/caramel-audio-prod)
    #      PDF_CONVERT_URL         (ex: https://…/caramel-pdf-convert-prod)
    #      CARAMEL_VIDEO_TRANSCRIPT_URL        (ex: https://…/caramel-video-transcript-prod)
    #      CARAMEL_VIDEO_TRANSCRIPT_SUBMIT_URL (ex: https://…/caramel-video-transcript-submit-prod)
    #      CARAMEL_VIDEO_TRANSCRIPT_RESULT_URL (ex: https://…/caramel-video-transcript-result-prod)
    #      CARAMEL_FETCH_PAGE_URL       (ex: https://…/caramel-fetch-page-prod)
    #      CARAMEL_VISION_DETECT_URL    (ex: https://…/caramel-vision-detect-prod)
    #      CARAMEL_TTS_URL              (ex: https://…/caramel-tts-prod)
    #      CARAMEL_TTS_VOICES_URL       (ex: https://…/caramel-tts-voices-prod)
    #
    #    Les 13 sont OBLIGATOIRES : le build echoue (exit 1) si l'une manque.
    # ------------------------------------------------------------------
    - |
      echo "=== Injection URLs n8n ==="
      if [ -z "$LLM_SUBMIT_URL" ] || [ -z "$LLM_RESULT_URL" ] || [ -z "$LLM_STATS_URL" ] || [ -z "$CARAMELIA_WEBHOOK_URL" ] || [ -z "$CARAMELIA_AUDIO_URL" ] || [ -z "$PDF_CONVERT_URL" ] || [ -z "$CARAMEL_VIDEO_TRANSCRIPT_URL" ] || [ -z "$CARAMEL_VIDEO_TRANSCRIPT_SUBMIT_URL" ] || [ -z "$CARAMEL_VIDEO_TRANSCRIPT_RESULT_URL" ] || [ -z "$CARAMEL_FETCH_PAGE_URL" ] || [ -z "$CARAMEL_VISION_DETECT_URL" ] || [ -z "$CARAMEL_TTS_URL" ] || [ -z "$CARAMEL_TTS_VOICES_URL" ]; then
        echo "  ERREUR: une des 13 URLs n8n (LLM_SUBMIT_URL, LLM_RESULT_URL, LLM_STATS_URL, CARAMELIA_WEBHOOK_URL, CARAMELIA_AUDIO_URL, PDF_CONVERT_URL, CARAMEL_VIDEO_TRANSCRIPT_URL, CARAMEL_VIDEO_TRANSCRIPT_SUBMIT_URL, CARAMEL_VIDEO_TRANSCRIPT_RESULT_URL, CARAMEL_FETCH_PAGE_URL, CARAMEL_VISION_DETECT_URL, CARAMEL_TTS_URL, CARAMEL_TTS_VOICES_URL) n'est pas definie dans les variables CI/CD !"
        echo "  → GitLab > Settings > CI/CD > Variables"
        exit 1
      fi
      ENDPOINTS_FILE=.public/js/core/endpoints.js
      sed -i "s|const LLM_SUBMIT_URL = \".*\"|const LLM_SUBMIT_URL = \"${LLM_SUBMIT_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const LLM_RESULT_URL = \".*\"|const LLM_RESULT_URL = \"${LLM_RESULT_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const LLM_STATS_URL = \".*\"|const LLM_STATS_URL = \"${LLM_STATS_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const CARAMELIA_WEBHOOK_URL = \".*\"|const CARAMELIA_WEBHOOK_URL = \"${CARAMELIA_WEBHOOK_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const CARAMELIA_AUDIO_URL = \".*\"|const CARAMELIA_AUDIO_URL = \"${CARAMELIA_AUDIO_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const PDF_CONVERT_URL = \".*\"|const PDF_CONVERT_URL = \"${PDF_CONVERT_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const CARAMEL_VIDEO_TRANSCRIPT_URL = \".*\"|const CARAMEL_VIDEO_TRANSCRIPT_URL = \"${CARAMEL_VIDEO_TRANSCRIPT_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const CARAMEL_VIDEO_TRANSCRIPT_SUBMIT_URL = \".*\"|const CARAMEL_VIDEO_TRANSCRIPT_SUBMIT_URL = \"${CARAMEL_VIDEO_TRANSCRIPT_SUBMIT_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const CARAMEL_VIDEO_TRANSCRIPT_RESULT_URL = \".*\"|const CARAMEL_VIDEO_TRANSCRIPT_RESULT_URL = \"${CARAMEL_VIDEO_TRANSCRIPT_RESULT_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const CARAMEL_FETCH_PAGE_URL = \".*\"|const CARAMEL_FETCH_PAGE_URL = \"${CARAMEL_FETCH_PAGE_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const CARAMEL_VISION_DETECT_URL = \".*\"|const CARAMEL_VISION_DETECT_URL = \"${CARAMEL_VISION_DETECT_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const CARAMEL_TTS_URL = \".*\"|const CARAMEL_TTS_URL = \"${CARAMEL_TTS_URL}\"|g" "$ENDPOINTS_FILE"
      sed -i "s|const CARAMEL_TTS_VOICES_URL = \".*\"|const CARAMEL_TTS_VOICES_URL = \"${CARAMEL_TTS_VOICES_URL}\"|g" "$ENDPOINTS_FILE"
      echo "  LLM_SUBMIT_URL        : ${LLM_SUBMIT_URL}"
      echo "  LLM_RESULT_URL        : ${LLM_RESULT_URL}"
      echo "  LLM_STATS_URL         : ${LLM_STATS_URL}"
      echo "  CARAMELIA_WEBHOOK_URL : ${CARAMELIA_WEBHOOK_URL}"
      echo "  CARAMELIA_AUDIO_URL   : ${CARAMELIA_AUDIO_URL}"
      echo "  PDF_CONVERT_URL       : ${PDF_CONVERT_URL}"
      echo "  CARAMEL_VIDEO_TRANSCRIPT_URL : ${CARAMEL_VIDEO_TRANSCRIPT_URL}"
      echo "  CARAMEL_VIDEO_TRANSCRIPT_SUBMIT_URL : ${CARAMEL_VIDEO_TRANSCRIPT_SUBMIT_URL}"
      echo "  CARAMEL_VIDEO_TRANSCRIPT_RESULT_URL : ${CARAMEL_VIDEO_TRANSCRIPT_RESULT_URL}"
      echo "  CARAMEL_FETCH_PAGE_URL       : ${CARAMEL_FETCH_PAGE_URL}"
      echo "  CARAMEL_VISION_DETECT_URL    : ${CARAMEL_VISION_DETECT_URL}"
      echo "  CARAMEL_TTS_URL              : ${CARAMEL_TTS_URL}"
      echo "  CARAMEL_TTS_VOICES_URL       : ${CARAMEL_TTS_VOICES_URL}"

    # ------------------------------------------------------------------
    # 4. Minification JS — modules ES6 (~79 fichiers applicatifs)
    #
    #    - --module : préserve import/export, top-level await
    #    - --compress : dead code elimination, constant folding
    #    - --mangle : renomme les variables locales (pas les exports)
    #    - On exclut js/vendor/ (libs déjà optimisées + h5p-libs intouchables)
    #    - On exclut les .min.js (déjà minifiés)
    # ------------------------------------------------------------------
    - |
      echo "=== Minification JS ==="
      JS_COUNT=0
      JS_FAIL=0
      for f in $(find .public/js -name '*.js' -not -path '.public/js/vendor/*' -not -name '*.min.js'); do
        if npx terser "$f" \
          --module \
          --compress 'passes=2,dead_code=true,drop_console=false' \
          --mangle \
          --output "$f" 2>/dev/null; then
          JS_COUNT=$((JS_COUNT + 1))
        else
          echo "  WARN: echec minification $f (fichier original conserve)"
          JS_FAIL=$((JS_FAIL + 1))
        fi
      done
      echo "  JS: $JS_COUNT fichiers minifies, $JS_FAIL echecs"

    # ------------------------------------------------------------------
    # 5. Minification CSS (7 fichiers base + composants)
    #
    #    - On exclut css/vendor/ (FontAwesome, flag-icons déjà .min.css)
    # ------------------------------------------------------------------
    - |
      echo "=== Minification CSS ==="
      CSS_COUNT=0
      CSS_FAIL=0
      for f in $(find .public/css -name '*.css' -not -path '.public/css/vendor/*' -not -name '*.min.css'); do
        if npx clean-css-cli -O1 -o "$f.min" "$f" && [ -s "$f.min" ]; then
          mv "$f.min" "$f"
          CSS_COUNT=$((CSS_COUNT + 1))
        else
          rm -f "$f.min"
          echo "  WARN: echec minification $f (fichier original conserve)"
          CSS_FAIL=$((CSS_FAIL + 1))
        fi
      done
      echo "  CSS: $CSS_COUNT fichiers minifies, $CSS_FAIL echecs"

    # ------------------------------------------------------------------
    # 6. Compactage JSON — locales et exemples
    #
    #    Suppression des espaces et indentation (11 locales + exemples)
    # ------------------------------------------------------------------
    - |
      echo "=== Compactage JSON ==="
      JSON_COUNT=0
      for dir in .public/js/locales .public/assets/data/examples; do
        if [ -d "$dir" ]; then
          for f in $(find "$dir" -name '*.json'); do
            node -e "var f=require('fs'),p='$f';f.writeFileSync(p,JSON.stringify(JSON.parse(f.readFileSync(p,'utf8'))))" 2>/dev/null && JSON_COUNT=$((JSON_COUNT + 1))
          done
        fi
      done
      echo "  JSON: $JSON_COUNT fichiers compactes"

    # ------------------------------------------------------------------
    # 7. Minification HTML — index.html
    #
    #    Préserve les scripts inline (Matomo) et les attributs data-*
    # ------------------------------------------------------------------
    - |
      echo "=== Minification HTML ==="
      HTML_OK=0
      HTML_FAIL=0
      for f in .public/index.html; do
        [ -f "$f" ] || continue
        if npx html-minifier-terser \
            --collapse-whitespace \
            --remove-comments \
            --remove-empty-attributes \
            --minify-css true \
            --conservative-collapse \
            --keep-closing-slash \
            -o "$f" \
            "$f" 2>/dev/null; then
          HTML_OK=$((HTML_OK + 1))
        else
          HTML_FAIL=$((HTML_FAIL + 1))
          echo "  WARN: echec minification $f (original conserve)"
        fi
      done
      echo "  HTML: $HTML_OK fichiers minifies, $HTML_FAIL echecs"

    # ------------------------------------------------------------------
    # 8. Pré-compression Brotli + gzip (transport)
    #
    #    Génère une variante .br et .gz à côté de chaque fichier texte (après
    #    minification, pour compresser la sortie finale). GitLab Pages sert
    #    automatiquement la variante pré-compressée selon Accept-Encoding.
    #    zlib natif de Node → aucune install supplémentaire.
    # ------------------------------------------------------------------
    - |
      echo "=== Pré-compression Brotli + gzip ==="
      node scripts/precompress.mjs .public

    # ------------------------------------------------------------------
    # 9. Rapport de tailles
    # ------------------------------------------------------------------
    - |
      echo "=== Rapport final ==="
      echo "  JS (hors vendor) :"
      find .public/js -name '*.js' -not -path '.public/js/vendor/*' -exec cat {} + | wc -c | awk '{printf "    %d Ko\n", $1/1024}'
      echo "  CSS (hors vendor) :"
      find .public/css -name '*.css' -not -path '.public/css/vendor/*' -exec cat {} + | wc -c | awk '{printf "    %d Ko\n", $1/1024}'
      echo "  Locales JSON :"
      find .public/js/locales -name '*.json' -exec cat {} + | wc -c | awk '{printf "    %d Ko\n", $1/1024}'
      echo "  Total deploye :"
      du -sh .public/

    # ------------------------------------------------------------------
    # 10. Déplacement final pour GitLab Pages
    # ------------------------------------------------------------------
    - rm -rf public
    - mv .public public

  artifacts:
    paths:
      - public
